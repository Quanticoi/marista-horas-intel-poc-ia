name: Compose dependencies and integration
on:
  push:
    branches: [development, staging]
  pull_request:
    branches: [development, staging, main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: |
          python dev/validate_static.py
          python dev/generate_compose.py --check
          python -m pip install ruff==0.11.13
          ruff check src tests dev deployment/scripts --select F,E9 --no-cache
      - name: Generate disposable CI credentials
        shell: bash
        run: |
          for key in POSTGRES_PASSWORD MIGRATION_PASSWORD APP_PASSWORD READONLY_PASSWORD MLFLOW_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY RABBITMQ_PASSWORD API_TOKEN OPERATOR_TOKEN DASHBOARD_TOKEN JUPYTER_TOKEN INFERENCE_TOKEN MONITOR_TOKEN INGESTION_TOKEN; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> .env
          done
          mkdir -p workspace/notebooks data/compose-logs artifacts/reports/v2
          chmod 777 workspace workspace/notebooks artifacts/reports data/compose-logs
          # Checkout includes historical reports owned by the runner; both container
          # UIDs must be able to replace those generated evidence files.
          chmod -R a+rwX artifacts/reports
      - name: Build and provision dependencies
        run: |
          docker compose config --quiet
          docker compose build --build-arg CODE_VERSION="$GITHUB_SHA" mlflow jupyter
          docker compose run --rm --no-deps --entrypoint chown volume-tools 10001:10001 /restore/rustfs
          docker compose up -d --wait --wait-timeout 180 postgres rustfs rabbitmq
          docker compose run --rm --no-deps tools bootstrap
          docker compose run --rm --no-deps tools migrate
          docker compose run --rm --no-deps tools buckets
          docker compose run --rm --no-deps tools seed
          docker compose up -d --wait --wait-timeout 300
      - name: Validate each instance and its dependencies
        run: |
          for svc in mlflow inference api worker monitoramento dashboard ingestion; do
            docker compose exec -T "$svc" python -m pip check
            docker compose exec -T "$svc" python -m src.common.service_check "$svc"
          done
          docker compose exec -T jupyter /usr/local/bin/_entrypoint.sh python -m pip check
          docker compose exec -T jupyter /usr/local/bin/_entrypoint.sh python -m src.common.service_check jupyter
          docker compose run --rm --no-deps tools validate
          docker compose exec -T jupyter /usr/local/bin/_entrypoint.sh python -m src.workbench.execute_journey
          docker compose run --rm --no-deps --entrypoint python tools -m pytest tests/unit tests/integration -q -o cache_dir=/tmp/pytest-cache --junitxml=/reports/compose-junit.xml
          python deployment/scripts/check_access.py
      - name: Application contract notebook (read-only)
        run: |
          proposal_id=$(python -c "import json; print(json.load(open('artifacts/reports/journey-latest.json'))['execution_id'])")
          docker compose exec -T jupyter /usr/local/bin/_entrypoint.sh python -m src.workbench.execute_notebook 02_teste_inferencia_planilha_turmas.ipynb --proposal-id "$proposal_id"
      - name: V2 notebooks including opt-in paths in disposable CI
        run: docker compose exec -T -e POC_ISOLATED_TESTS=1 jupyter /usr/local/bin/_entrypoint.sh python -m src.workbench.v2_notebook_suite
      - name: Sanitized runtime diagnostics before cleanup
        if: always()
        run: python deployment/scripts/ci_diagnostics.py
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-results
          path: artifacts/reports/
      - name: Dispose isolated CI stack
        if: always()
        run: |
          if [ -f .runtime/models.compose.json ]; then
            docker compose -f compose.yaml -f .runtime/models.compose.json down
          else
            docker compose down
          fi
