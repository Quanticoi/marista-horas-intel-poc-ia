{
  "image": "pucpr-poc:0.1.0",
  "jupyterImage": "pucpr-jupyter:0.1.0",
  "storageClass": "local-path",
  "enabledStages": [
    "mlflow",
    "monitor"
  ],
  "resources": [
    {
      "stage": "mlflow",
      "resource": {
        "apiVersion": "v1",
        "kind": "Service",
        "metadata": {
          "name": "mlflow",
          "namespace": "mlops",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "type": "ClusterIP",
          "selector": {
            "app": "mlflow"
          },
          "ports": [
            {
              "name": "main",
              "port": 5000,
              "targetPort": 5000
            }
          ]
        }
      }
    },
    {
      "stage": "mlflow",
      "resource": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "mlflow",
          "namespace": "mlops",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "mlflow"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "mlflow",
                "app.kubernetes.io/part-of": "pucpr-poc"
              }
            },
            "spec": {
              "containers": [
                {
                  "name": "mlflow",
                  "image": "{{ .Values.image }}",
                  "imagePullPolicy": "IfNotPresent",
                  "command": [
                    "python",
                    "-m",
                    "src.common.launch",
                    "mlflow"
                  ],
                  "resources": {
                    "requests": {
                      "cpu": "100m",
                      "memory": "512Mi"
                    },
                    "limits": {
                      "cpu": "1",
                      "memory": "2Gi"
                    }
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "capabilities": {
                      "drop": [
                        "ALL"
                      ]
                    }
                  },
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "poc-config"
                      }
                    },
                    {
                      "secretRef": {
                        "name": "poc-runtime"
                      }
                    }
                  ],
                  "ports": [
                    {
                      "containerPort": 5000
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/health",
                      "port": 5000,
                      "httpHeaders": [
                        {
                          "name": "Host",
                          "value": "mlflow.mlops.svc.cluster.local:5000"
                        }
                      ]
                    },
                    "periodSeconds": 10,
                    "timeoutSeconds": 5
                  },
                  "livenessProbe": {
                    "tcpSocket": {
                      "port": 5000
                    },
                    "initialDelaySeconds": 30,
                    "periodSeconds": 20
                  },
                  "startupProbe": {
                    "httpGet": {
                      "path": "/health",
                      "port": 5000,
                      "httpHeaders": [
                        {
                          "name": "Host",
                          "value": "mlflow.mlops.svc.cluster.local:5000"
                        }
                      ]
                    },
                    "failureThreshold": 60,
                    "periodSeconds": 5,
                    "timeoutSeconds": 5
                  },
                  "env": [
                    {
                      "name": "MLFLOW_WORKERS",
                      "value": "1"
                    }
                  ]
                }
              ],
              "terminationGracePeriodSeconds": 60,
              "automountServiceAccountToken": false,
              "securityContext": {
                "fsGroup": 1000
              }
            }
          },
          "strategy": {
            "type": "RollingUpdate"
          }
        }
      }
    },
    {
      "stage": "monitor",
      "resource": {
        "apiVersion": "v1",
        "kind": "Service",
        "metadata": {
          "name": "monitoramento",
          "namespace": "mlops",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "type": "ClusterIP",
          "selector": {
            "app": "monitoramento"
          },
          "ports": [
            {
              "name": "main",
              "port": 8010,
              "targetPort": 8010
            }
          ]
        }
      }
    },
    {
      "stage": "monitor",
      "resource": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "monitoramento",
          "namespace": "mlops",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "monitoramento"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "monitoramento",
                "app.kubernetes.io/part-of": "pucpr-poc"
              }
            },
            "spec": {
              "containers": [
                {
                  "name": "monitoramento",
                  "image": "{{ .Values.image }}",
                  "imagePullPolicy": "IfNotPresent",
                  "command": [
                    "python",
                    "-m",
                    "uvicorn",
                    "src.monitoring.main:app",
                    "--host",
                    "0.0.0.0",
                    "--port",
                    "8010",
                    "--no-access-log"
                  ],
                  "resources": {
                    "requests": {
                      "cpu": "100m",
                      "memory": "128Mi"
                    },
                    "limits": {
                      "cpu": "1",
                      "memory": "512Mi"
                    }
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "capabilities": {
                      "drop": [
                        "ALL"
                      ]
                    }
                  },
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "poc-config"
                      }
                    },
                    {
                      "secretRef": {
                        "name": "poc-monitor"
                      }
                    }
                  ],
                  "ports": [
                    {
                      "containerPort": 8010
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/ready",
                      "port": 8010
                    },
                    "periodSeconds": 10,
                    "timeoutSeconds": 15
                  },
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/health",
                      "port": 8010
                    },
                    "periodSeconds": 20
                  },
                  "startupProbe": {
                    "tcpSocket": {
                      "port": 8010
                    },
                    "failureThreshold": 60,
                    "periodSeconds": 5
                  }
                }
              ],
              "terminationGracePeriodSeconds": 60,
              "automountServiceAccountToken": false,
              "securityContext": {
                "fsGroup": 1000
              }
            }
          },
          "strategy": {
            "type": "RollingUpdate"
          }
        }
      }
    }
  ]
}
