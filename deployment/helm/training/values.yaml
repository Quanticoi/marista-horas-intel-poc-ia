{
  "image": "pucpr-poc:0.1.0",
  "jupyterImage": "pucpr-jupyter:0.1.0",
  "storageClass": "local-path",
  "enabledStages": [
    "app"
  ],
  "resources": [
    {
      "stage": "app",
      "resource": {
        "apiVersion": "v1",
        "kind": "PersistentVolumeClaim",
        "metadata": {
          "name": "workspace",
          "namespace": "training",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          },
          "annotations": {
            "helm.sh/resource-policy": "keep"
          }
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": "{{ .Values.storageClass }}",
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    },
    {
      "stage": "app",
      "resource": {
        "apiVersion": "v1",
        "kind": "Service",
        "metadata": {
          "name": "jupyter",
          "namespace": "training",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "type": "ClusterIP",
          "selector": {
            "app": "jupyter"
          },
          "ports": [
            {
              "name": "main",
              "port": 8888,
              "targetPort": 8888
            }
          ]
        }
      }
    },
    {
      "stage": "app",
      "resource": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "jupyter",
          "namespace": "training",
          "labels": {
            "app.kubernetes.io/part-of": "pucpr-poc"
          }
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "jupyter"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "jupyter",
                "app.kubernetes.io/part-of": "pucpr-poc"
              }
            },
            "spec": {
              "containers": [
                {
                  "name": "jupyter",
                  "image": "{{ .Values.jupyterImage }}",
                  "imagePullPolicy": "IfNotPresent",
                  "command": [
                    "/usr/local/bin/_entrypoint.sh",
                    "python",
                    "-m",
                    "src.common.launch",
                    "jupyter"
                  ],
                  "resources": {
                    "requests": {
                      "cpu": "100m",
                      "memory": "128Mi"
                    },
                    "limits": {
                      "cpu": "2",
                      "memory": "3Gi"
                    }
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "capabilities": {
                      "drop": [
                        "ALL"
                      ]
                    }
                  },
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "poc-config"
                      }
                    },
                    {
                      "secretRef": {
                        "name": "poc-runtime"
                      }
                    }
                  ],
                  "ports": [
                    {
                      "containerPort": 8888
                    }
                  ],
                  "readinessProbe": {
                    "tcpSocket": {
                      "port": 8888
                    },
                    "initialDelaySeconds": 5,
                    "periodSeconds": 10
                  },
                  "livenessProbe": {
                    "tcpSocket": {
                      "port": 8888
                    },
                    "initialDelaySeconds": 30,
                    "periodSeconds": 20
                  },
                  "startupProbe": {
                    "tcpSocket": {
                      "port": 8888
                    },
                    "failureThreshold": 60,
                    "periodSeconds": 5
                  },
                  "volumeMounts": [
                    {
                      "name": "storage",
                      "mountPath": "/workspace"
                    }
                  ]
                }
              ],
              "terminationGracePeriodSeconds": 60,
              "automountServiceAccountToken": false,
              "securityContext": {
                "fsGroup": 1000
              },
              "volumes": [
                {
                  "name": "storage",
                  "persistentVolumeClaim": {
                    "claimName": "workspace"
                  }
                }
              ]
            }
          },
          "strategy": {
            "type": "Recreate"
          }
        }
      }
    }
  ]
}
