[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pucpr-mlops-poc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.8", "uvicorn==0.34.0", "pydantic==2.10.6",
  "SQLAlchemy==2.0.38", "psycopg[binary]==3.2.4", "psycopg2-binary==2.9.10", "alembic==1.14.1",
  "pandas==2.2.3", "numpy==2.2.2", "pyarrow==19.0.0",
  "scikit-learn==1.6.1", "statsmodels==0.14.4", "scipy==1.15.2", "matplotlib==3.10.0",
  "mlflow==3.11.1", "boto3==1.36.26", "celery==5.4.0", "cloudpickle==3.1.2",
  "httpx==0.28.1", "PyYAML==6.0.2",
  "jupyterlab==4.3.5", "ipykernel==6.29.5", "ipywidgets==8.1.7", "pytest==8.3.4"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, MLflow and RustFS services", "e2e: full deployed stack"]
